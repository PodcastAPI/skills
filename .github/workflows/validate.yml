name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Agent Skill specification
        shell: bash
        run: |
          set -euo pipefail
          for skill in podcast-api podcast-mcp; do
            uvx \
              --from "git+https://github.com/agentskills/agentskills.git@8d8fcbc69e0c42e05922c2ffc287a3bbdef7b0a3#subdirectory=skills-ref" \
              skills-ref validate "skills/$skill"
          done

      - name: Validate repository contracts
        run: uv run --with PyYAML==6.0.3 python scripts/validate.py

      - name: Build OpenAI plugin
        run: python scripts/build_plugin.py

      - name: Discover skills with skills CLI
        run: npx --yes skills@1.5.11 add "$GITHUB_WORKSPACE" --list

      - name: Smoke-test agent installations
        shell: bash
        run: |
          set -euo pipefail
          for skill in podcast-api podcast-mcp; do
            for agent in codex claude-code cursor; do
              target="$(mktemp -d)"
              (
                cd "$target"
                npx --yes skills@1.5.11 add "$GITHUB_WORKSPACE" \
                  --skill "$skill" \
                  --agent "$agent" \
                  --copy \
                  --yes
              )
              test "$(find "$target" -path "*/$skill/SKILL.md" -type f | wc -l)" -ge 1
              expected_references="$(find "$GITHUB_WORKSPACE/skills/$skill/references" -name '*.md' -type f | wc -l)"
              test "$(find "$target" -path "*/$skill/references/*.md" -type f | wc -l)" -eq "$expected_references"
              if [ "$skill" = podcast-mcp ]; then
                test "$(find "$target" -path '*/podcast-mcp/agents/openai.yaml' -type f | wc -l)" -ge 1
              fi
              rm -rf "$target"
            done
          done

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          # These public sites intentionally reject some automated bot traffic.
          args: >-
            --no-progress
            --max-retries 3
            --exclude '^https://listen-api\.listennotes\.com/api/v2$'
            --exclude '^https://listen-api-test\.listennotes\.com/api/v2'
            --exclude '^https://(www\.)?listennotes\.com/'
            --exclude '^https://(www\.)?podcastapi\.com/'
            './README.md'
            './AGENTS.md'
            './plugins/**/*.md'
            './skills/**/*.md'
          fail: true
